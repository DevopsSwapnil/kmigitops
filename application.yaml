apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kmigitops-app-3
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:DevopsSwapnil/kmigitops.git'
    targetRevision: HEAD
    path: '.' 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
