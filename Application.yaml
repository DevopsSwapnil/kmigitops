# argocd/app.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: all-apps
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DevopsSwapnil/kmigitops.git
    targetRevision: main
    path: apps

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true